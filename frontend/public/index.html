<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta
      name="description"
      content="Justice Genie is a free AI legal assistant for Indian law - ask legal questions in plain English, test your knowledge with interactive quizzes, and access a curated legal document library."
    />
    <meta name="author" content="Subhash & Siri" />
    <title>Justice Genie - AI Legal Assistant for Indian Law</title>

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Slack, Discord, iMessage) -->
    <!-- These MUST be static here, not injected by React/Helmet - link-preview
         scrapers for these platforms don't run JavaScript, so anything added
         dynamically after page load would be invisible to them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Justice Genie" />
    <meta property="og:title" content="Justice Genie | AI Legal Assistant for Indian Law" />
    <meta property="og:description" content="Get instant, plain-English answers to Indian legal questions, practice with interactive quizzes, and access a curated legal document library - free during early access." />
    <meta property="og:url" content="https://justice-genie-mu.vercel.app/" />
    <meta property="og:image" content="https://justice-genie-mu.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Justice Genie - AI Legal Assistant for Indian Law" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Justice Genie | AI Legal Assistant for Indian Law" />
    <meta name="twitter:description" content="Get instant, plain-English answers to Indian legal questions, practice with interactive quizzes, and access a curated legal document library - free during early access." />
    <meta name="twitter:image" content="https://justice-genie-mu.vercel.app/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap" rel="stylesheet">

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons -->

     <link
      rel="icon"
      type="image/svg+xml"
      href="%PUBLIC_URL%/favicon.svg"
    />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    
    
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="%PUBLIC_URL%/favicon-96x96.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Justice Genie" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> 
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
